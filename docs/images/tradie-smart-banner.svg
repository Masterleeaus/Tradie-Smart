<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Tradie Smart source archive</title><desc id="desc">A slate and copper banner for Tradie Smart, an attributed Worksuite Laravel source archive with vendor modules, project management domains, and installation evidence.</desc>
