  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="64" y="64" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="3">TRADIE SMART � WORKSUITE SOURCE ARCHIVE � ATTRIBUTION RETAINED</text><text x="64" y="126" fill="#f8fafc" font-size="46" font-weight="800">Tradie Smart</text><text x="64" y="158" fill="#cbd5e1" font-size="16">Laravel project-management source with vendor modules and documented installation</text></g>
