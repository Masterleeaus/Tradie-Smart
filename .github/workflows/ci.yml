name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} — ${{ matrix.db }} tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worksuite_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        # composer.lock currently resolves openspout/openspout 4.32.x, which requires PHP 8.3+.
        php: ["8.3"]
        db: ["mysql", "sqlite"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull_request_target runs in base-branch context; explicitly check out
          # the PR head so tests run against the proposed changes.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, zip, bcmath, intl, gd, exif, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Prepare bootstrap/cache for later Artisan commands
        run: mkdir -p bootstrap/cache && chmod -R 775 storage bootstrap/cache

      - name: Install Composer dependencies
        run: |
          # composer install exits 4 when the lock file is out of sync with composer.json
          # (e.g. when packages were added to composer.json without running composer update).
          # In that case, update only the out-of-sync packages to fix the lock file first.
          if ! composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts; then
            composer update laravel/mcp laravel/reverb --no-interaction --prefer-dist --no-scripts
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          fi

      - name: Reinstall PHPUnit and Collision to ensure complete vendor files
        # The committed vendor may have an incomplete phpunit installation (missing Event/Events/Test/*).
        # composer install skips reinstall when installed.json says the version is present.
        # Force a clean reinstall of both packages to guarantee all files exist.
        run: composer reinstall phpunit/phpunit nunomaduro/collision --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Build frontend assets
        run: npm run production
        env:
          NODE_ENV: production

      - name: Prepare .env
        run: |
          cp .env.example .env
          # Override to CI-safe values
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          if [ "${{ matrix.db }}" = "mysql" ]; then
            sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
            sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
            sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
            sed -i 's/^DB_DATABASE=.*/DB_DATABASE=worksuite_ci/' .env
            sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
            sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          else
            SQLITE_DB=/tmp/worksuite_ci.sqlite
            touch "$SQLITE_DB"
            sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
            sed -i 's#^DB_DATABASE=.*#DB_DATABASE='"$SQLITE_DB"'#' .env
          fi
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Package discovery
        run: php artisan package:discover --ansi

      - name: Clear caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Migration smoke test (fresh rebuild)
        run: php artisan migrate:fresh --force --no-interaction

      - name: Route/bootstrap smoke checks
        run: |
          set -o pipefail
          if ! php artisan route:list > /tmp/route-list.txt 2>&1; then
            echo "route:list failed; captured Artisan output:"
            tail -80 /tmp/route-list.txt
            if [ -f storage/logs/laravel.log ]; then
              echo "Laravel exception log:"
              grep -E 'ERROR:|CRITICAL:|ALERT:|EMERGENCY:' storage/logs/laravel.log | tail -40 || true
            fi
            exit 1
          fi
          tail -5 /tmp/route-list.txt
          if ! php artisan about > /tmp/artisan-about.txt 2>&1; then
            echo "artisan about failed; captured Artisan output:"
            tail -80 /tmp/artisan-about.txt
            exit 1
          fi
          cat /tmp/artisan-about.txt

      - name: Run tests
        run: php artisan test
